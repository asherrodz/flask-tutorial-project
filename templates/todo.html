<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Page</title>
</head>
<body>

    <h1>To-Do List</h1>

    <form action="/submittodoitem" method="POST">
	<label for="itemId">Item ID:</label><br>
        <input type="text" id="itemId" name="itemId" required><br><br>
        <label for="itemName">Item Name:</label><br>
        <input type="text" id="itemName" name="itemName" required><br><br>

        <label for="itemDescription">Item Description:</label><br>
        <textarea id="itemDescription" name="itemDescription" rows="5" cols="40" required></textarea><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
